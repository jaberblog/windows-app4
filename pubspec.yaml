name: persian_calendar_widget
description: A Borderless Persian Calendar & Todo Desktop Widget for Windows with Auto-Startup.
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shamsi_date: ^1.0.4
  window_manager: ^0.3.9
  launch_at_startup: ^0.3.1
  package_info_plus: ^8.0.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # در صورتی که فایل فونت یکان بخ را در پوشه assets/fonts قرار دادید، بخش زیر را از حالت کامنت خارج کنید:
  # fonts:
  #   - family: Yekan Bakh FaNum
  #     fonts:
  #       - asset: assets/fonts/YekanBakhFaNum-Bold.ttf
  #         weight: 700
